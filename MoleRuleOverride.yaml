proxy-groups:
  - name: 节点选择
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 国外流量
      - 国内流量
      - 日本节点
      - 香港节点
      - 美国节点
      - 默认自建
      - DIRECT
  - name: 手动选择
    icon: https://testingcf.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png
    include-all: true
    type: select
  - name: 自动选择
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    include-all: true
    exclude-filter: (?i)电信|联通|移动|自建|朝鲜
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 国外流量
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 日本节点
      - 香港节点
      - 美国节点
      - DIRECT
  - name: 国内流量
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/DomesticMedia.png
    type: select
    proxies:
      - DIRECT
  - name: 日本节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
    include-all: true
    filter: (?i)(?=.*(日本|东京|大阪|泉日|埼玉|川日|沪日|深日|JP|Japan))(?!.*自建).*
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 香港节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
    include-all: true
    filter: (?i)(?=.*(港|香港|HK|Hong Kong|HongKong|hongkong))(?!.*自建).*
    type: url-test
    url: https://www.moles.top/generate_204
    interval: 300
    tolerance: 50
  - name: 美国节点
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
    include-all: true
    filter: (?i)(?=.*(美国|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States))(?!.*自建).*
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 香港自建
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
    include-all: true
    filter: (?i)(?=.*(港|香港|HK|Hong Kong|HongKong|hongkong))(?=.*自建).*
    type: select
  - name: 美国自建
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
    include-all: true
    filter: (?i)(?=.*(美国|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States))(?=.*自建).*
    type: select
  - name: 默认自建
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png
    include-all: true
    filter: (?i)自建
    type: select
  - name: EH
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Pornhub.png
    type: select
    proxies:
      - 默认自建
      - 香港节点
      - 美国节点
  - name: Gofile & MEGA
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - 日本节点
      - 默认自建
      - 自动选择
      - 手动选择
      - 国外流量
  - name: X
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png
    type: select
    proxies:
      - 香港节点
      - 香港自建
      - 手动选择
      - 国外流量
  - name: Apple
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
    type: select
    proxies:
      - 国外流量
      - 国内流量
  - name: Jetbrains
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Jetbrains.png
    type: select
    proxies:
      - 美国节点
      - 国内流量
      - 日本节点
      - 国外流量
  - name: Google
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 香港节点
      - 自动选择
  - name: OpenAI
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png
    type: select
    proxies:
      - 美国节点
      - 美国自建
      - 日本节点
      - 国内流量
  - name: Microsoft
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png
    type: select
    proxies:
      - 美国节点
      - 香港节点
      - 日本节点
      - 国内流量
  - name: 游戏平台
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
    type: select
    proxies:
      - 国内流量
      - 国外流量
      - 手动选择
  - name: 漏网之鱼
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png
    type: select
    proxies:
      - 国外流量
      - 国内流量
      - 手动选择
  - name: GLOBAL
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    include-all: true
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 手动选择
      - 国外流量
      - 国内流量
      - 日本节点
      - 香港节点
      - 美国节点
      - 香港自建
      - 美国自建
      - 默认自建
      - EH
      - Gofile & MEGA
      - X
      - Apple
      - Jetbrains
      - Google
      - OpenAI
      - Microsoft
      - 游戏平台
      - 漏网之鱼

